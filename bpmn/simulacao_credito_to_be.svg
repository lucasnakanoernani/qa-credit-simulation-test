<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 1100" role="img" aria-labelledby="title desc"><title id="title">Simulação de crédito — fluxo proposto revisado</title><desc id="desc">Dados inválidos são corrigidos e revalidados antes do processamento. A simulação pode apresentar um resultado ou informar indisponibilidade.</desc><rect width="1060" height="1100" fill="#fafafa"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#343434"/></marker></defs><polyline points="430,75 430,115" fill="none" stroke="#343434" stroke-width="2" marker-end="url(#arrow)"/><polyline points="430,179 430,225" fill="none" stroke="#343434" stroke-width="2" marker-end="url(#arrow)"/><polyline points="430,289 430,335" fill="none" stroke="#343434" stroke-width="2" marker-end="url(#arrow)"/><polyline points="430,399 430,449" fill="none" stroke="#343434" stroke-width="2" marker-end="url(#arrow)"/><polyline points="490,489 710,489" fill="none" stroke="#343434" stroke-width="2" marker-end="url(#arrow)"/><text x="600.0" y="480.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#333">Não</text><polyline points="820,457 820,399" fill="none" stroke="#343434" stroke-width="2" marker-end="url(#arrow)"/><polyline points="710,367 530,367" fill="none" stroke="#343434" stroke-width="2" marker-end="url(#arrow)"/><text x="620.0" y="358.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#333">Revalidar</text><polyline points="430,529 430,579" fill="none" stroke="#343434" stroke-width="2" marker-end="url(#arrow)"/><text x="449.0" y="545.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#333">Sim</text><polyline points="430,644 430,694" fill="none" stroke="#343434" stroke-width="2" marker-end="url(#arrow)"/><polyline points="370,734 220,734 220,840" fill="none" stroke="#343434" stroke-width="2" marker-end="url(#arrow)"/><text x="295.0" y="725.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#333">Sim</text><polyline points="490,734 720,734 720,840" fill="none" stroke="#343434" stroke-width="2" marker-end="url(#arrow)"/><text x="605.0" y="725.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#333">Não</text><polyline points="220,910 220,975" fill="none" stroke="#343434" stroke-width="2" marker-end="url(#arrow)"/><polyline points="720,910 720,975" fill="none" stroke="#343434" stroke-width="2" marker-end="url(#arrow)"/><circle cx="430.0" cy="55.0" r="20.0" fill="#fff" stroke="#222" stroke-width="2"/><text x="462" y="60.0" font-family="Arial,sans-serif" font-size="15">Início</text><rect x="330" y="115" width="200" height="64" rx="10" fill="#fff" stroke="#9c2836" stroke-width="2"/><text x="430.0" y="152.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#222">Acessar o simulador</text><rect x="330" y="225" width="200" height="64" rx="10" fill="#fff" stroke="#9c2836" stroke-width="2"/><text x="430.0" y="262.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#222">Preencher dados</text><rect x="330" y="335" width="200" height="64" rx="10" fill="#fff" stroke="#9c2836" stroke-width="2"/><text x="430.0" y="372.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#222">Validar os dados</text><polygon points="430.0,449 490,489.0 430.0,529 370,489.0" fill="#fff2d6" stroke="#775b24" stroke-width="2"/><path d="M423.0 482.0 l14 14 m0 -14 l-14 14" stroke="#775b24" stroke-width="2"/><rect x="370.0" y="424.0" width="120" height="20" fill="#fafafa"/><text x="430.0" y="439" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">Dados válidos?</text><rect x="710" y="457" width="220" height="64" rx="10" fill="#fff" stroke="#9c2836" stroke-width="2"/><text x="820.0" y="484.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#222">Informar campos</text><text x="820.0" y="504.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#222">inválidos</text><rect x="710" y="335" width="220" height="64" rx="10" fill="#fff" stroke="#9c2836" stroke-width="2"/><text x="820.0" y="372.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#222">Corrigir os dados</text><rect x="330" y="579" width="200" height="64" rx="10" fill="#fff" stroke="#9c2836" stroke-width="2"/><text x="430.0" y="616.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#222">Processar a simulação</text><polygon points="430.0,694 490,734.0 430.0,774 370,734.0" fill="#fff2d6" stroke="#775b24" stroke-width="2"/><path d="M423.0 727.0 l14 14 m0 -14 l-14 14" stroke="#775b24" stroke-width="2"/><rect x="350.0" y="669.0" width="160" height="20" fill="#fafafa"/><text x="430.0" y="684" text-anchor="middle" font-family="Arial,sans-serif" font-size="14">Resultado disponível?</text><rect x="100" y="840" width="240" height="70" rx="10" fill="#fff" stroke="#9c2836" stroke-width="2"/><text x="220.0" y="870.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#222">Exibir resultado da</text><text x="220.0" y="890.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#222">simulação</text><rect x="600" y="840" width="240" height="70" rx="10" fill="#fff" stroke="#9c2836" stroke-width="2"/><text x="720.0" y="870.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#222">Informar impossibilidade</text><text x="720.0" y="890.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#222">de simular</text><circle cx="220.0" cy="995.0" r="20.0" fill="#fff" stroke="#222" stroke-width="4"/><text x="252" y="1000.0" font-family="Arial,sans-serif" font-size="15">Fim</text><circle cx="720.0" cy="995.0" r="20.0" fill="#fff" stroke="#222" stroke-width="4"/><text x="752" y="1000.0" font-family="Arial,sans-serif" font-size="15">Fim</text><text x="530" y="1060" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#555">Proposta de melhoria • Uma simulação não representa aprovação definitiva de crédito.</text></svg>